  note: >-
    j-rock/j-pop 태그 191곡 중 OFFICIAL HIGE DANDISM이 33곡으로 압도적 1위이고, Vaundy·星野源·
    Saucy Dog가 뒤를 받치는 구조라 프로필의 중력을 히게단 쪽(피아노 리드, 조밀한 재즈/가스펠 코드, 높고 밝은
    남성 테너)에 두었고 그것이 instrumentation의 piano 승격과 harmony·vocal 항목의 근거다. 히게단 곡
    상당수가 "LIVE at STADIUM 2025" 라이브 음원이라, production을 드라이한 스튜디오가 아니라 아레나
    앰비언스가 살아있는 라이브 밴드 사운드로 지정했다. 동시 태그에 math rock 17곡·midwest emo 17곡
    (Hitohira 등)이 붙어 있어 clean 기타의 인터로킹 아르페지오와 변박·싱코페이션을 tempo_rhythm과
    instrumentation.roles에 명시했다. 발매연도가 2021년 이후에 몰려 있고 중앙값 3.9분으로 짧은 편이라
    dynamic_arc를 4-8마디 단위로 빠르게 전개되는 압축 구조로 잡았다.
  genre_tags: [j-rock, j-pop, rock, math rock, midwest emo, emo, indie rock]
